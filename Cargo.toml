[package]
name = "project-watch"
version = "0.1.0"
edition = "2021"
description = "Project Watch prototype: explainable project-risk watch list (TISC Challenge 15). Sample data only."

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = false
